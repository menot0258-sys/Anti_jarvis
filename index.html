<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jarvis</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>@property --a{syntax:'<color>';inherits:true;initial-value:#566070}
@property --b{syntax:'<color>';inherits:true;initial-value:#8a94a6}
*{box-sizing:border-box}
body{--bg:#131314;--s1:#1e1f20;--s2:#2a2c2f;--tx:#e6e6e8;--mut:#a0a5ab;--hi:#ffffff14;--lo:#0000004a;--sh1:#08090a;--sh2:#2e3033;--ac:linear-gradient(135deg,#4f8cf7,#9b72cb 60%,#d96570);
--clay:6px 6px 14px var(--sh1),-4px -4px 12px var(--sh2),inset 2px 2px 4px var(--hi),inset -3px -3px 6px var(--lo);
--clays:3px 3px 8px var(--sh1),-3px -3px 7px var(--sh2),inset 1px 1px 2px var(--hi),inset -2px -2px 4px var(--lo);
--clayin:inset 4px 4px 9px var(--sh1),inset -3px -3px 8px var(--sh2);--line:#ffffff14;
--a:#566070;--b:#8a94a6;--sp:1;--lv:0;margin:0;height:100vh;display:flex;flex-direction:column;color:var(--tx);font:15px/1.55 "Google Sans","Product Sans",system-ui,"Segoe UI",sans-serif;
background:radial-gradient(900px 520px at 12% -8%,#4f8cf726,transparent 62%),radial-gradient(800px 520px at 100% 0,#9b72cb22,transparent 60%),var(--bg);overflow:hidden;transition:--a 1.2s,--b 1.2s}
body.light{--bg:#e9edf5;--s1:#f3f6fb;--s2:#e2e7f1;--tx:#1f2328;--mut:#5a6371;--hi:#ffffffe6;--lo:#0000001c;--sh1:#bec6d6;--sh2:#ffffff;--line:#0000001a}
body[data-s=listen]{--a:#3b82c4;--b:#8fd0f5;--sp:1.4}body[data-s=think]{--a:#7a66d6;--b:#6bb8ee;--sp:3.2}
body[data-s=run]{--a:#2f9d68;--b:#a3ecc0;--sp:2.2}body[data-s=speak]{--a:#d08545;--b:#f6d3a2;--sp:2}body[data-s=error]{--a:#c24848;--b:#f4a3a3;--sp:2.5}
header{height:60px;flex:none;display:flex;align-items:center;gap:10px;padding:6px 18px;overflow-x:auto;scrollbar-width:none}
.logo{font-weight:500;font-size:21px;letter-spacing:.2px;margin-right:auto;background:var(--ac);-webkit-background-clip:text;background-clip:text;color:transparent}
button,select,input,textarea{font:inherit;color:inherit}
button,select{background:var(--s1);border:0;border-radius:22px;padding:8px 15px;font-size:13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;box-shadow:var(--clays);transition:transform .12s,box-shadow .15s,filter .15s}
button:hover{filter:brightness(1.1)}button:active{box-shadow:var(--clayin);transform:translateY(1px)}
.pri{background:var(--ac);color:#fff;font-weight:500;box-shadow:4px 4px 10px #0006,-2px -2px 8px #ffffff22,inset 2px 2px 4px #ffffff55,inset -3px -3px 6px #0000003d}
.tog.on{box-shadow:var(--clayin);color:#4cc27a}body.light .tog.on{color:#188038}
.red{background:linear-gradient(135deg,#e2574c,#c0392b);color:#fff;box-shadow:4px 4px 10px #0005,inset 2px 2px 4px #ffffff55,inset -3px -3px 6px #0000003d}
#bStop{display:none}body.busy #bStop{display:inline-flex}
.ic{width:16px;height:16px;flex:none}.ib{width:44px;height:44px;padding:0;border-radius:50%;justify-content:center}.ib .ic{width:19px;height:19px}
#wrap{flex:1;display:flex;min-height:0}#col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.orb{position:relative;width:clamp(96px,15vmin,140px);aspect-ratio:1;flex:none;margin-top:6px;transform:scale(calc(1 + var(--lv)*.32));transition:width .7s,height .7s}
.orb i{position:absolute;inset:0;border-radius:60% 40% 55% 45%/50% 60% 40% 50%;mix-blend-mode:screen;animation:morph calc(9s/var(--sp)) ease-in-out infinite,spin calc(16s/var(--sp)) linear infinite}
body.light .orb i{mix-blend-mode:normal;opacity:.92}
.orb i:nth-child(1){background:radial-gradient(circle at 30% 28%,var(--b),var(--a) 72%);box-shadow:0 0 90px -10px var(--a)}
.orb i:nth-child(2){background:radial-gradient(circle at 70% 62%,var(--a),transparent 66%);animation-duration:calc(7s/var(--sp)),calc(21s/var(--sp));animation-direction:normal,reverse}
.orb i:nth-child(3){inset:14%;background:radial-gradient(circle at 40% 40%,var(--b),transparent 70%);animation-duration:calc(5s/var(--sp)),calc(11s/var(--sp));animation-direction:alternate,reverse;opacity:.85}
@keyframes morph{50%{border-radius:42% 58% 46% 54%/62% 40% 60% 38%}}@keyframes spin{to{rotate:360deg}}
#sub{min-height:30px;margin:14px 24px 4px;text-align:center;color:var(--tx);opacity:.85;font-size:17px;max-width:780px;transition:.3s}#sub.dim{opacity:.55;font-style:italic}
#hero{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px 20px;max-width:800px}
body.empty #hero{display:flex}body.empty #chat{display:none}
#hero h1{font-size:clamp(32px,5.6vw,54px);font-weight:500;margin:0;letter-spacing:-.8px}.grad{background:var(--ac);-webkit-background-clip:text;background-clip:text;color:transparent}
#hero p{color:var(--mut);font-size:17px;margin:6px 0 20px;max-width:560px}#hero>button{margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}.chip{padding:12px 18px;border-radius:20px;font-size:14px}
#chat{flex:1;width:100%;max-width:780px;overflow-y:auto;padding:6px 18px;scrollbar-width:thin}
.m{margin:12px 0;padding:11px 18px;border-radius:22px;white-space:pre-wrap;word-break:break-word;max-width:88%;animation:in .3s}@keyframes in{from{opacity:0;transform:translateY(6px)}}
.u{background:var(--s2);margin-left:auto;box-shadow:var(--clays);border-bottom-right-radius:8px}.ai{padding-left:4px;font-size:16px;position:relative}.err{background:#4a2a2e;color:#ffc9c9;box-shadow:var(--clays)}body.light .err{background:#fbe3e3;color:#8c1d18}
.m img{max-width:min(360px,100%);border-radius:20px;display:block;box-shadow:var(--clay)}
.cp{background:none;box-shadow:none;padding:4px;position:absolute;top:6px;right:6px;opacity:0;border-radius:8px}.m.ai:hover .cp{opacity:.65}.cp:hover{opacity:1!important}.cp:active{box-shadow:none}
/* rich messages */
.m.ai.rich{white-space:normal;max-width:100%;padding-right:34px}.rich>:first-child{margin-top:0}.rich>:last-child{margin-bottom:0}.rich p{margin:.55em 0}
.mh{margin:1em 0 .4em;line-height:1.25;font-weight:600}h1.mh,h2.mh{font-size:1.45em;background:var(--ac);-webkit-background-clip:text;background-clip:text;color:transparent}h3.mh{font-size:1.2em}h4.mh{font-size:1.05em;color:var(--mut)}
.rich ul,.rich ol{margin:.5em 0;padding-left:1.4em}.rich li{margin:.25em 0}.rich hr{border:0;height:2px;background:var(--line);margin:1em 0}
.rich a{color:#8ab4f8;text-decoration:none;border-bottom:1px solid #8ab4f855;word-break:break-word}.rich a:hover{border-bottom-color:currentColor}body.light .rich a{color:#1a5fd0;border-bottom-color:#1a5fd055}
.rich code{background:#8883;padding:1px 6px;border-radius:7px;font:.88em ui-monospace,"JetBrains Mono",Consolas,monospace}
.rich blockquote{margin:.8em 0;padding:8px 16px;border-radius:14px;background:var(--s1);box-shadow:var(--clays);border-left:4px solid #9b72cb}.rich blockquote p{margin:.2em 0}
.tbw{overflow-x:auto;margin:.9em 0;border-radius:18px;box-shadow:var(--clay);background:var(--s1)}.rich table{border-collapse:collapse;width:100%;font-size:.94em}
.rich th{background:linear-gradient(135deg,#4f8cf738,#9b72cb38);font-weight:600;padding:10px 14px;white-space:nowrap}.rich td{padding:9px 14px;border-top:1px solid var(--line)}.rich tbody tr:nth-child(even) td{background:#8881}
.cbk{background:#1e1f22;color:#bcbec4;border-radius:18px;overflow:hidden;margin:.9em 0;box-shadow:var(--clay);text-align:left}
.cbh{display:flex;justify-content:space-between;align-items:center;background:#2b2d30;color:#9da0a8;font:12px system-ui,sans-serif;padding:6px 8px 6px 14px;text-transform:lowercase}
.cbc{background:#393b40;color:#d3d5da;padding:4px 11px;font-size:11.5px;border-radius:12px;box-shadow:none}.cbc .ic{width:12px;height:12px}
.cbk pre{margin:0;padding:13px 16px;overflow:auto;font:13px/1.6 ui-monospace,"JetBrains Mono",Consolas,monospace;tab-size:2}.cbk code{background:none!important;padding:0!important;font:inherit!important;color:inherit}
.tk{color:#cc7832}.ts{color:#6a8759}.tn{color:#6897bb}.tc{color:#7a7e85;font-style:italic}
.math{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;white-space:nowrap}.math.blk{display:block;text-align:center;margin:.9em 0;font-size:1.2em;overflow-x:auto;padding:6px 0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;font-size:.95em}.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 4px}.fr>span:last-child{padding:0 4px}
.ov{border-top:1px solid currentColor;padding-top:1px;margin-left:1px}.tx{font-style:normal}.math sup,.math sub{font-size:.7em}
/* command + output: white clay cards */
.cmd{background:#f7f9fd;color:#1f2328;border-radius:22px;margin:12px 0;overflow:hidden;font:12.5px/1.5 ui-monospace,"JetBrains Mono",Consolas,monospace;max-width:100%;box-shadow:6px 6px 16px var(--sh1),-4px -4px 12px var(--sh2),inset 2px 2px 5px #fff,inset -3px -3px 8px #d6dce8}
.cmd>div{padding:7px 14px;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow:auto;display:block}
.cmd>.h{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;background:#0000000a;color:#2b3a55;font-weight:600;padding:9px 12px 9px 14px}.ht{flex:1;min-width:0;white-space:pre-wrap;word-break:break-all}
.ac{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}.cb{background:#fff;color:#2b3a55;padding:4px 10px;border-radius:14px;font:500 11.5px system-ui,sans-serif;box-shadow:2px 2px 6px #c5ccd9,-2px -2px 5px #fff}.cb .ic{width:12px;height:12px}
.cmd .e{color:#c5221f}.cmd .x{color:#137333}.cmd .ic{width:13px;height:13px;vertical-align:-2px;margin-right:4px}.cb .ic{margin:0}
.cmd button:not(.cb){background:#fff;color:#2b3a55;box-shadow:2px 2px 6px #c5ccd9,-2px -2px 6px #fff;margin:6px 0 10px 10px}.cmd button.pri{background:var(--ac);color:#fff}
.dot span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--mut);animation:bn 1s infinite}.dot span:nth-child(2){animation-delay:.15s}.dot span:nth-child(3){animation-delay:.3s}@keyframes bn{50%{transform:translateY(-5px);opacity:.4}}
/* composer */
form{width:calc(100% - 36px);max-width:744px;margin:6px 0 22px;padding:7px 9px;display:flex;gap:4px;align-items:center;background:var(--s1);border-radius:34px;box-shadow:var(--clay)}
#in{flex:1;min-width:0;background:transparent;border:0;outline:0;padding:10px 12px;font-size:15.5px}#in::placeholder{color:var(--mut)}
form .ib{background:transparent;box-shadow:none}form .ib:hover{background:var(--s2)}form .ib.pri{background:var(--ac);box-shadow:3px 3px 8px #0005,inset 2px 2px 4px #ffffff55,inset -2px -2px 5px #0000003d}
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--s2);box-shadow:var(--clay);padding:9px 18px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;z-index:30;font-size:13px}#toast.on{opacity:1;transform:translateX(-50%)}
/* editor */
#ed{display:none;width:58%;flex-direction:column;background:#2b2b2b;margin:2px 14px 14px 0;border-radius:26px;overflow:hidden;box-shadow:var(--clay);color:#e6e6e6}body.ed #ed{display:flex}
#et{display:flex;gap:6px;flex-wrap:wrap;padding:9px;background:#3c3f41;align-items:center}#et select{background:#2b2b2b;border-radius:10px;padding:5px 9px;font-size:12.5px;max-width:200px;box-shadow:none;color:#e6e6e6}#et button{background:#4a4d4f;color:#e6e6e6;padding:5px 12px;box-shadow:none}
#edb{flex:1;display:flex;min-height:0}#mon{flex:1;min-width:0;position:relative}#pv{flex:1;border:0;border-left:1px solid #444;background:#fff;min-width:0}
#aib{display:flex;gap:8px;align-items:center;padding:9px 12px;background:#313335;border-top:1px solid #444}#aib .ic{color:#cc7832}#ai2{flex:1;background:#2b2b2b;border:1px solid #666;border-radius:14px;padding:9px 13px;outline:0;color:#e6e6e6}#ai2:focus{border-color:#cc7832}
#stat{font-size:12px;color:#a9b7c6;padding:5px 14px;background:#3c3f41;min-height:26px}#stat.bad{color:#f4a3a3}
.scan{background:linear-gradient(90deg,#2ea04388,#388bfd66)!important}
.te{position:absolute;inset:0;display:flex;font:13px/1.5 ui-monospace,Consolas,monospace;background:#2b2b2b;overflow:hidden}.te.flash{box-shadow:inset 0 0 0 2px #2ea043}
.te pre{margin:0;padding:8px 10px;background:#313335;color:#606366;text-align:right;min-width:44px;user-select:none;overflow:hidden}.te textarea{flex:1;background:transparent;color:#a9b7c6;border:0;outline:0;resize:none;padding:8px 10px;white-space:pre;overflow:auto;tab-size:2;font:inherit}
/* live */
#lb{display:none;position:fixed;bottom:26px;left:0;right:0;justify-content:center;gap:14px;z-index:6}
body.live header,body.live #chat,body.live form,body.live #ed,body.live #hero{display:none!important}body.live #lb{display:flex}
body.live .orb{position:fixed;inset:0;margin:auto;width:min(82vw,82vh);transition:width .7s;opacity:.9}
body.live #sub{position:fixed;left:0;right:0;bottom:14vh;max-width:none;font-size:clamp(20px,3.4vw,36px);z-index:3;text-shadow:0 0 18px #000,0 2px 6px #000;margin:0 6vw;color:#fff;opacity:1}
body.live .ask{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:9;max-width:90vw}body.ed .orb{width:84px}
/* settings */
dialog{background:var(--s1);color:var(--tx);border:0;border-radius:30px;padding:0;width:min(680px,94vw);max-height:92vh;box-shadow:var(--clay),0 30px 90px #000a}dialog::backdrop{background:#000b}
.dh{display:flex;align-items:center;gap:10px;padding:16px 22px;position:sticky;top:0;background:var(--s1);z-index:2}.dh b{font-size:18px;font-weight:500;margin-right:auto}
#sbody{padding:4px 22px 10px;overflow:auto;max-height:calc(92vh - 140px)}.df{padding:14px 22px;text-align:right;position:sticky;bottom:0;background:var(--s1)}
.card2{background:var(--s1);border-radius:24px;padding:16px 18px;margin:16px 0;box-shadow:var(--clay)}.ch{display:flex;align-items:center;gap:9px}.ch b{font-weight:500}.ch .ic{width:18px;height:18px;color:#8ab4f8}
.tag{margin-left:auto;font-size:11px;padding:3px 10px;border-radius:12px;background:#8882;color:var(--mut)}.tag.req{background:#f9ab0033;color:#e0a010}.tag.free{background:#34a85326;color:#34a853}.tag.soon{background:#4285f426;color:#6b9bf5}
.why{color:var(--mut);font-size:13px;margin:8px 0 6px}.why b{color:var(--tx);font-weight:500}.why a{color:#8ab4f8;text-decoration:none}
.card2 label{display:block;margin:11px 0 5px;color:var(--mut);font-size:12.5px}.card2 input:not([type=checkbox]),.card2 select,.card2 textarea{width:100%;background:var(--s1);box-shadow:var(--clayin);border:0;border-radius:14px;padding:10px 13px;outline:0;color:var(--tx)}
.card2 input[type=range]{padding:0}.card2 textarea{resize:vertical;font:12.5px ui-monospace,Consolas,monospace}.card2 input[type=checkbox]{width:18px;height:18px;vertical-align:middle;accent-color:#4f8cf7}.card2 .chk{display:inline-block;margin-left:8px;color:var(--tx);font-size:13.5px}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}.mem{font-size:13px;margin:8px 0}.mem div{padding:4px 0;border-bottom:1px solid var(--line)}
@media(max-width:1000px){header .t{display:none}}@media(max-width:800px){body.ed #col{display:none}body.ed #ed{width:auto;flex:1;margin:0 10px 10px}}
/* ===== v2 polish ===== */
body{font-family:"Plus Jakarta Sans","Google Sans",system-ui,"Segoe UI",sans-serif;--a:#5f6a80;--b:#a3afc8;--g:linear-gradient(150deg,#2c2e33,#1b1c1f)}
body.light{--g:linear-gradient(150deg,#ffffff,#e2e7f0);--a:#7b88a6;--b:#c3cde4}
::selection{background:#4f8cf766}*{scrollbar-width:thin;scrollbar-color:#8885 transparent}::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#8885;border-radius:8px}
header{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.2px}.logo::before{content:"";width:24px;height:24px;border-radius:50%;background:var(--ac);box-shadow:inset 2px 2px 4px #fff7,inset -3px -3px 6px #0004,0 0 16px #9b72cb88;flex:none}
button,select,.u,form,.tbw,dialog{background:var(--g)}
button:hover{transform:translateY(-1px);filter:brightness(1.12)}button:active{transform:translateY(1px)}
.orb::after{content:"";position:absolute;left:20%;top:12%;width:36%;height:20%;border-radius:50%;background:radial-gradient(ellipse,#ffffffb0,transparent 72%);filter:blur(3px);transform:rotate(-28deg);pointer-events:none}
body.light .orb::after{background:radial-gradient(ellipse,#fff,transparent 72%)}
#stl{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--mut);padding:5px 13px;border-radius:14px;background:var(--g);box-shadow:var(--clays);margin-top:10px;letter-spacing:.2px}
#stl::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--a);box-shadow:0 0 10px var(--a)}#stl::after{content:"Ready"}
body[data-s=listen] #stl::after{content:"Listening"}body[data-s=think] #stl::after{content:"Thinking…"}body[data-s=run] #stl::after{content:"Working…"}body[data-s=speak] #stl::after{content:"Speaking"}body[data-s=error] #stl::after{content:"Something went wrong"}
body.live #stl{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:4;margin:0}
body:not(.live):not(.ed).empty .orb{width:clamp(150px,27vmin,240px);margin-top:3vh}
#hero{padding-bottom:8px}#hero h1{font-size:clamp(34px,6vw,58px);font-weight:600;letter-spacing:-1.2px}#hero p{font-size:17px;line-height:1.6}
.chips{max-width:720px}.chip{transition:transform .15s,box-shadow .15s}.chip:hover{transform:translateY(-3px)}
.chip:nth-child(1) .ic{color:#4f8cf7}.chip:nth-child(2) .ic{color:#9b72cb}.chip:nth-child(3) .ic{color:#f4b400}.chip:nth-child(4) .ic{color:#e0707c}.chip:nth-child(5) .ic{color:#34a853}
.m.ai{padding-left:42px;min-height:34px}.m.ai::before{content:"";position:absolute;left:4px;top:11px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 30% 28%,#fff8,transparent 45%),var(--ac);box-shadow:var(--clays)}
.m.ai.rich{padding-left:42px}.m.ai .cp{right:2px}
.m.u{padding:11px 20px}
form{transition:box-shadow .25s}form:focus-within{box-shadow:var(--clay),0 0 0 2px #7f8cf7aa,0 0 30px #9b72cb44}
.cmd::before{content:"";display:block;height:3px;background:var(--ac)}.cmd{transition:transform .15s}
.ch .ic{width:32px;height:32px;padding:7px;border-radius:50%;background:#8ab4f822;color:#8ab4f8}body.light .ch .ic{color:#1a5fd0;background:#1a5fd01a}
.card2{transition:transform .15s}.dh b{font-weight:600}
@media(max-width:600px){header{padding:6px 10px;gap:6px}.logo{font-size:0;gap:0;order:-2}#bLive{order:-1}#bFs,#bNew{display:none}#hero h1{font-size:30px}#hero p{font-size:15px}.chip{padding:10px 14px;font-size:13px}.m{max-width:100%}.m.ai,.m.ai.rich{padding-left:38px}form{width:calc(100% - 20px)}#chat{padding:6px 10px}body:not(.live):not(.ed).empty .orb{width:140px}.cb span{display:none}}
/* ===== v3: dark command cards, solid chat panel, terminal, palette ===== */
body{--panel:#16171a}body.light{--panel:#eceff6}
.cmd{background:#17181b;color:#d4d7dc;box-shadow:var(--clay)}.cmd>.h{background:#222428;color:#b9c4d8}
.cb{background:#2f3136;color:#d4d7dc;box-shadow:2px 2px 6px #0008,-1px -1px 4px #ffffff0d}.cmd .x{color:#6fcf97}.cmd .e{color:#f28b82}
.cmd button:not(.cb){background:var(--g);color:var(--tx);box-shadow:var(--clays)}
#cw{position:relative;flex:1;min-height:0;width:calc(100% - 36px);max-width:780px;display:flex;border-radius:30px;background:var(--panel);box-shadow:var(--clayin);overflow:hidden;margin:6px 0 4px}
#cw::before,#cw::after{content:"";position:absolute;left:0;right:0;height:28px;z-index:2;pointer-events:none}
#cw::before{top:0;background:linear-gradient(var(--panel) 15%,transparent)}#cw::after{bottom:0;background:linear-gradient(transparent,var(--panel) 85%)}
